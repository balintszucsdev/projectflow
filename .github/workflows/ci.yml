name: CI

on:
    push:
    pull_request:

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"

            - name: Verify Node.js
              run: |
                  node --version
                  npm --version

            - name: Install backend dependencies
              working-directory: backend
              run: npm ci

            - name: Build backend
              working-directory: backend
              run: npm run build

            - name: Run backend unit tests
              working-directory: backend
              run: npm test -- --runInBand

            - name: Run backend E2E tests
              working-directory: backend
              run: npm run test:e2e -- --runInBand

            - name: Install frontend dependencies
              working-directory: frontend
              run: npm ci

            - name: Build frontend
              working-directory: frontend
              run: npm run build
            
            - name: Run frontend tests
              working-directory: frontend
              run: npm test -- --watch=false

            - name: Install Playwright Chromium
              working-directory: frontend
              run: npx playwright install --with-deps chromium

            - name: Run Playwright E2E tests
              working-directory: frontend
              run: npx playwright test --project=chromium
              env:
                DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/projectflow

            - name: Build backend Docker image
              run: docker build -t projectflow-backend:ci ./backend
              
    deploy:
        name: Deploy backend to Azure
        needs: ci
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Login to Azure with OIDC
              uses: azure/login@v3
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Login to Azure Container Registry
              run: az acr login --name "${{ vars.ACR_NAME }}"

            - name: Build backend Docker image
              run: |
                  docker build \
                    -t "${{ vars.ACR_LOGIN_SERVER }}/projectflow-backend:${{ github.sha }}" \
                    -t "${{ vars.ACR_LOGIN_SERVER }}/projectflow-backend:latest" \
                    ./backend

            - name: Push backend Docker image
              run: |
                  docker push "${{ vars.ACR_LOGIN_SERVER }}/projectflow-backend:${{ github.sha }}"
                  docker push "${{ vars.ACR_LOGIN_SERVER }}/projectflow-backend:latest"

            - name: Install Container Apps CLI extension
              run: az extension add --name containerapp --upgrade

            - name: Deploy backend to Azure Container Apps
              run: |
                  az containerapp update \
                    --name "${{ vars.AZURE_CONTAINER_APP }}" \
                    --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                    --image "${{ vars.ACR_LOGIN_SERVER }}/projectflow-backend:${{ github.sha }}"