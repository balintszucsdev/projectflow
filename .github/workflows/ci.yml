name: CI

on:
    push:
    pull_request:

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"

            - name: Verify Node.js
              run: |
                  node --version
                  npm --version

            - name: Install backend dependencies
              working-directory: backend
              run: npm ci

            - name: Build backend
              working-directory: backend
              run: npm run build
