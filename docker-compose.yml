services:
  postgres:
    image: postgres:16-alpine
    container_name: projectflow-postgres
    environment:
      POSTGRES_DB: projectflow
      POSTGRES_USER: projectflow
      POSTGRES_PASSWORD: projectflow
    ports:
      - "5432:5432"
    volumes:
      - projectflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectflow -d projectflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: projectflow-backend
    environment:
      DATABASE_URL: postgresql://projectflow:projectflow@postgres:5432/projectflow
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: ./backend
      target: build
    environment:
      DATABASE_URL: postgresql://projectflow:projectflow@postgres:5432/projectflow
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "db", "migrate"]

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: projectflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - projectflow-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    container_name: projectflow-grafana
    ports:
      - "3001:3000"
    volumes:
      - projectflow-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  projectflow-postgres-data:
  projectflow-prometheus-data:
  projectflow-grafana-data: